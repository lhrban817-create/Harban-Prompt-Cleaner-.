<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مُنقّي الأوامر - علي حربان</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; display: flex; flex-direction: column; min-height: 100vh; padding: 16px; }
        header { text-align: center; margin-bottom: 20px; padding: 16px; background: #1e293b; border-radius: 12px; border: 1px solid #334155; }
        h1 { color: #38bdf8; font-size: 1.6rem; margin-bottom: 6px; }
        p.subtitle { color: #94a3b8; font-size: 0.85rem; }
        main { max-width: 600px; margin: 0 auto; width: 100%; display: flex; flex-direction: column; gap: 16px; flex: 1; }
        label { font-weight: 600; color: #cbd5e1; font-size: 0.9rem; display: block; margin-bottom: 6px; }
        textarea { width: 100%; background: #1e293b; border: 1px solid #334155; color: #f8fafc; border-radius: 8px; padding: 12px; font-size: 0.9rem; resize: vertical; outline: none; }
        textarea:focus { border-color: #38bdf8; }
        .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
        button { border: none; padding: 12px 16px; border-radius: 8px; font-weight: bold; cursor: pointer; font-size: 0.9rem; transition: 0.2s; }
        .btn-primary { background: #0284c7; color: white; flex: 2; }
        .btn-secondary { background: #334155; color: #cbd5e1; flex: 1; }
        .btn-copy { background: #16a34a; color: white; padding: 6px 12px; font-size: 0.75rem; border-radius: 6px; }
        .output-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
        .output-box { background: #022c22; border: 1px solid #065f46; color: #6ee7b7; }
        footer { margin-top: auto; padding-top: 20px; text-align: center; border-top: 1px solid #1e293b; font-size: 0.85rem; color: #94a3b8; }
        .badge { background: #3b82f6; color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.75rem; margin-top: 8px; display: inline-block; font-weight: bold; }
    </style>
</head>
<body>

    <header>
        <h1>⚡ مُنقّي الأوامر الذكي</h1>
        <p class="subtitle">نظّف نصوصك وأكوادك واحمي بياناتك الحساسة قبل إرسالها للذكاء الاصطناعي</p>
        <span class="badge">تطوير: علي حربان</span>
    </header>

    <main>
        <div>
            <label>النص أو الكود الأصلي:</label>
            <textarea id="rawInput" rows="5" placeholder="ألصق النص أو الكود هنا..."></textarea>
        </div>

        <div class="btn-group">
            <button onclick="cleanPrompt()" class="btn-primary">🧹 تنظيف وإخفاء البيانات</button>
            <button onclick="clearAll()" class="btn-secondary">🗑️ مسح</button>
        </div>

        <div>
            <div class="output-header">
                <label style="color: #4ade80;">النص الجاهز للذكاء الاصطناعي:</label>
                <button onclick="copyOutput()" class="btn-copy">📋 نسخ النص</button>
            </div>
            <textarea id="cleanOutput" rows="5" readonly class="output-box" placeholder="النتيجة المنظفة ستظهر هنا..."></textarea>
        </div>
    </main>

    <footer>
        جميع الحقوق محفوظة &copy; 2026 - تم التطوير بواسطة <b>علي حربان</b>
    </footer>

    <script src="script.js"></script>
</body>
</html>
